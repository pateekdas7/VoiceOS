# VoiceOS v2 -- application alerts (Sprint-027.md): error rate spike,
# circuit breaker open, DLQ growing.
#
# Architecture: V7 Ch8 (Alerting), V3 Ch11 (Circuit Breakers), V3 Ch4 (DLQ).

groups:
  - name: voiceos_application
    rules:
      - alert: ErrorRateSpike
        expr: |
          (
            sum by (service) (rate(voiceos_gpu_scheduler_errors_total[5m]))
            or sum by (service) (rate(voiceos_conversation_engine_errors_total[5m]))
            or sum by (service) (rate(voiceos_media_gateway_errors_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          route: ticket
        annotations:
          summary: "Error rate spike on {{ $labels.service }}"
          description: "{{ $labels.service }} error rate has exceeded 0.05 req/s over 5 minutes."

      - alert: CircuitBreakerOpen
        expr: voiceos_circuit_breaker_state == 2
        for: 1m
        labels:
          severity: warning
          route: ticket
        annotations:
          summary: "Circuit breaker OPEN for dependency {{ $labels.service }}"
          description: "voiceos_circuit_breaker_state has been 2 (OPEN) for {{ $labels.service }} for at least 1 minute -- downstream calls are being short-circuited."

      - alert: CircuitBreakerOpenCritical
        expr: voiceos_circuit_breaker_state == 2
        for: 10m
        labels:
          severity: critical
          route: page
        annotations:
          summary: "Circuit breaker OPEN for {{ $labels.service }} for over 10 minutes"
          description: "Sustained OPEN circuit breaker for {{ $labels.service }} -- likely a prolonged dependency outage. Page on-call."

      - alert: DLQGrowing
        expr: increase(voiceos_queue_size_current{queue_name=~".*dlq.*"}[15m]) > 5
        for: 5m
        labels:
          severity: warning
          route: ticket
        annotations:
          summary: "DLQ depth growing for {{ $labels.queue_name }}"
          description: "{{ $labels.queue_name }} has grown by more than 5 entries in the last 15 minutes -- events are exhausting their retry budget."

      - alert: DLQDepthCritical
        expr: voiceos_queue_size_current{queue_name=~".*dlq.*"} > 100
        for: 5m
        labels:
          severity: critical
          route: page
        annotations:
          summary: "DLQ depth critical for {{ $labels.queue_name }} ({{ $value }} entries)"
          description: "{{ $labels.queue_name }} has exceeded 100 entries -- likely a systemic downstream failure, not transient retries."

      - alert: HighTurnLatency
        expr: histogram_quantile(0.95, sum by (le, tenant_id) (rate(voiceos_turn_latency_ms_bucket[5m]))) > 4000
        for: 5m
        labels:
          severity: warning
          route: ticket
          team: voice
        annotations:
          summary: "p95 turn latency > 4000 ms for tenant {{ $labels.tenant_id }}"
          description: >
            95th-percentile end-to-end turn latency (VADSpeechEnd → first TTS frame)
            has exceeded 4 seconds over the past 5 minutes. Customers experience
            noticeable dead air. Check STT / LLM / TTS p95 histograms individually
            to isolate the bottleneck. GPU node may be saturated or cold.
          runbook: "infra/runbooks/high-turn-latency.md"

      - alert: HighTurnLatencyCritical
        expr: histogram_quantile(0.95, sum by (le, tenant_id) (rate(voiceos_turn_latency_ms_bucket[5m]))) > 7000
        for: 3m
        labels:
          severity: critical
          route: page
          team: voice
        annotations:
          summary: "p95 turn latency > 7000 ms — callers hearing dead air"
          description: >
            Turn latency p95 has exceeded 7 seconds — callers are hanging up.
            This is the architecture's hard SLA boundary (V1 Ch23 §23.5).
            Page on-call; consider routing to a fallback TTS or reducing LLM max_tokens.
          runbook: "infra/runbooks/high-turn-latency.md"

      - alert: PostgresErrors
        expr: rate(voiceos_bff_pg_errors_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          route: ticket
          team: platform
        annotations:
          summary: "PostgreSQL error rate elevated ({{ $value | humanize }}/s)"
          description: >
            voiceos_bff_pg_errors_total is incrementing at more than 0.05/s.
            Possible causes: connection pool exhaustion, slow query blocking the
            pool, OOMKilled Postgres pod, or failed migration. Check BFF logs for
            pg.idle_client_error events.
          runbook: "infra/runbooks/postgres-errors.md"

      - alert: PostgresErrorsCritical
        expr: rate(voiceos_bff_pg_errors_total[5m]) > 0.5
        for: 2m
        labels:
          severity: critical
          route: page
          team: platform
        annotations:
          summary: "Critical Postgres error rate > 0.5/s — BFF degraded"
          description: >
            PostgreSQL errors are occurring at > 0.5/s. At this rate campaign
            creation, lead uploads, and session auth are all failing. Page on-call.
          runbook: "infra/runbooks/postgres-errors.md"

      - alert: RedisErrors
        expr: rate(voiceos_bff_redis_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          route: ticket
          team: platform
        annotations:
          summary: "Redis error rate elevated ({{ $value | humanize }}/s)"
          description: >
            voiceos_bff_redis_errors_total is incrementing at more than 0.1/s.
            The dialer queue and session-token store are both Redis-backed; errors
            here cause calls to fail silently. Check Redis pod health and memory.
          runbook: "infra/runbooks/redis-errors.md"

      - alert: RedisErrorsCritical
        expr: rate(voiceos_bff_redis_errors_total[5m]) > 1.0
        for: 2m
        labels:
          severity: critical
          route: page
          team: platform
        annotations:
          summary: "Critical Redis error rate > 1/s — dialer queue unreachable"
          description: >
            Redis is effectively unreachable from the BFF. Outbound calls cannot
            be queued or dequeued. Page on-call immediately.
          runbook: "infra/runbooks/redis-errors.md"
