# VoiceOS v2 -- static Prometheus file_sd target list, production environment.
#
# One entry per voiceos-platform Helm chart (port/namespace read from each
# chart's own values.yaml -- see infra/helm/voiceos-platform/charts/*/values.yaml
# and infra/helm/voiceos-platform/values.yaml for saas-ops). Mirrors the
# Kubernetes-SD-discovered `voiceos-services` job so target coverage can be
# cross-checked even when pod-annotation SD is unavailable (e.g. a
# non-Kubernetes smoke run of Prometheus itself).
#
# Regenerate by hand whenever a chart's service.port changes (no chart has
# changed its port since Sprint-026).
#
# Hostnames are prefixed `voiceos-platform-<service>` -- the Helm fullname
# helper (`voiceos.fullname`, infra/helm/_chart_template/templates/_helpers.tpl)
# produces `<release-name>-<chart-name>` Service objects, and every
# documented `helm upgrade --install` in this project uses the release
# name `voiceos-platform` (CPU_NODE_STATE.md §5.2) -- found live (Sprint-027
# Phase 2): the bare per-chart name alone does not resolve.

- targets:
    - voiceos-platform-media-gateway.voiceos-runtime.svc.cluster.local:8010
  labels:
    namespace: voiceos-runtime
    service: media-gateway
