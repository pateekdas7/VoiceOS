# VoiceOS v2 -- Loki configuration (Sprint-027.md).
#
# Label-based log storage. Retention: 30 days (DPDP compliance -- no
# longer than needed; matches the 30-day figure named in Sprint-027.md's
# own "Log requirements" section, distinct from RetentionScheduler's
# 90d-recordings/180d-transcripts audio/transcript policy, Sprint-019).
#
# Architecture: V7 Ch9 (Logging).

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h # 30 days, per Sprint-027.md's DPDP-driven "Retention: 30 days"
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit: 8MB
  max_query_series: 5000
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager.voiceos-ops.svc.cluster.local:9093

# Indexed labels (Sprint-027.md's literal list): tenant_id, service,
# call_id, trace_id, severity -- populated by fluentbit.conf's Label_keys.
# Loki does not need a separate "index these labels" directive (every
# label FluentBit attaches is automatically indexed); documented here so
# the two files are read together.
