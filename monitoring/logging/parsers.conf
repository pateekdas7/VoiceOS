# VoiceOS v2 -- FluentBit parser definitions (Sprint-027).
#
# `voiceos_json` parses every VoiceOS service's StructuredLogger output
# (Sprint-016) -- one JSON object per line, already carrying
# tenant_id/service/call_id/trace_id/severity keys per fluentbit.conf's
# own Label_keys list.
#
# `cri` is required by fluentbit.conf's [INPUT] `Parser cri`. This
# cluster's container runtime is containerd (kubeadm/Calico, Sprint-026),
# whose CRI log format is a plain-text line
# (`<time> <stream> <partial-flag> <log>`), NOT Docker's json-file driver
# format (`{"log":"...","stream":"...","time":"..."}`) -- found live
# (Sprint-027 Phase 2): a `docker`-format parser silently failed to
# extract a usable `log` field from every real line on this cluster
# (77 records reached Loki with zero errors, but with none of the
# StructuredLogger fields lifted, since the `log` field it expected never
# existed). Normally shipped in FluentBit's own default parsers.conf, but
# supplying a custom Parsers_File replaces that default entirely, so it
# must be defined here too.

[PARSER]
    Name        cri
    Format      regex
    Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<_p>[^ ]*) (?<log>.*)$
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On

[PARSER]
    Name         voiceos_json
    Format       json
    Time_Key     timestamp
    Time_Format  %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep    On
