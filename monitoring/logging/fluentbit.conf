# VoiceOS v2 -- FluentBit DaemonSet configuration (Sprint-027).
#
# Tails every container's JSON log (StructuredLogger, Sprint-016, already
# PII-redacted by PIIRedactor per Sprint-020's unconditional-redaction
# rule), parses it, and forwards to Loki with the indexed labels
# Sprint-027.md requires: tenant_id, service, call_id, trace_id, severity.
#
# Deployed as a DaemonSet so every node's kubelet-managed container log
# directory is tailed (one FluentBit pod per node -- single-node cluster
# today, but the config generalizes to N nodes without change).
#
# Architecture: V7 Ch9 (Logging).

[SERVICE]
    Flush        1
    Log_Level    info
    Daemon       off
    Parsers_File parsers.conf
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

[INPUT]
    Name              tail
    Tag               kube.*
    Path              /var/log/containers/*_voiceos-runtime_*.log,/var/log/containers/*_voiceos-ops_*.log,/var/log/containers/*_voiceos-platform_*.log,/var/log/containers/*_voiceos-data_*.log
    Parser            cri
    DB                /var/log/flb_kube.db
    Mem_Buf_Limit      50MB
    Skip_Long_Lines   On
    Refresh_Interval  5

# The `kubernetes` filter (pod-metadata enrichment via the API server) is
# deliberately NOT used here -- found live (Sprint-027 Phase 2): this
# cluster's apiserver advertise address is unreachable from in-cluster
# pods (the same NAT limitation as BACKLOG.md's TT-015, which was
# previously understood to only affect the GPU node), so the filter can
# never succeed. Worse, its constant 10s-interval retry loop against
# kubernetes.default.svc:443 was found to starve FluentBit's own
# networking/DNS resolution for its *other* output (Loki) in the same
# process -- with the kubernetes filter enabled, zero records ever
# reached Loki even though the tail input was reading them correctly
# (confirmed via /api/v1/metrics: input=114 records, output=0 delivered).
# Parsing the app's own JSON (StructuredLogger, Sprint-016) directly off
# the `log` field the `cri` parser already extracts needs no API access
# at all, and unblocks delivery entirely.
[FILTER]
    Name         parser
    Match        kube.*
    Key_Name     log
    Parser       voiceos_json
    Reserve_Data On

[OUTPUT]
    Name        loki
    Match       kube.*
    Host        loki.voiceos-ops.svc.cluster.local
    Port        3100
    Labels      job=fluentbit
    # Sprint-027.md's own list names this label `severity` -- the actual
    # StructuredLogger JSON field (src/libs/observability/logger.py) is
    # named `level`; indexed here under its real name.
    Label_keys  $tenant_id,$service,$call_id,$trace_id,$level
    Line_Format json
    Auto_Kubernetes_Labels off
    Remove_Keys stream
