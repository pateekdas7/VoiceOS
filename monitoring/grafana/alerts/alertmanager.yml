# VoiceOS v2 -- Alertmanager routing configuration (Sprint-027.md).
#
# Routes: CRITICAL -> PagerDuty (page on-call, <5 min), WARNING -> JIRA
# (auto-created ticket), INFO -> Slack channel. Receiver credentials are
# never hardcoded here -- every receiver reads its key/webhook from an
# environment variable resolved at container start (same "runtime
# injection only" rule as src/libs/secrets/, CLAUDE.md's Security section).
#
# Architecture: V7 Ch8 (Alerting).

global:
  resolve_timeout: 5m

route:
  receiver: default-slack
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: pagerduty-critical
      continue: true
      group_wait: 10s
      repeat_interval: 15m
    - match:
        severity: warning
      receiver: jira-warning
      continue: true
      repeat_interval: 12h
    - match:
        severity: info
      receiver: default-slack
      repeat_interval: 24h

inhibit_rules:
  # A firing CRITICAL for the same alertname+service suppresses the
  # corresponding WARNING (slow-burn) notification -- no duplicate paging.
  - source_matchers: ["severity=critical"]
    target_matchers: ["severity=warning"]
    equal: ["alertname", "service"]

receivers:
  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key: "${PAGERDUTY_SERVICE_KEY}"
        severity: critical
        description: '{{ .CommonAnnotations.summary }}'

  - name: jira-warning
    webhook_configs:
      - url: "${JIRA_WEBHOOK_URL}"
        send_resolved: true

  - name: default-slack
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#voiceos-alerts"
        send_resolved: true
        title: '{{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'
