name: VoiceOS CI

on:
  push:
    branches: ["main", "feature/**", "fix/**", "hotfix/**"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 — Static analysis (ruff + mypy)
  # ---------------------------------------------------------------------------
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: ruff — lint
        run: ruff check src/ tests/

      - name: ruff — format check
        run: ruff format --check src/ tests/

      - name: mypy — strict type checking
        run: mypy --strict src/ tests/

      - name: check_pii_logs.py — StructuredLogger never emits raw PII (blocking, Sprint-020)
        run: python scripts/check_pii_logs.py

  # ---------------------------------------------------------------------------
  # Stage 2 — Module boundary check (V6 Ch2 enforcement)
  # ---------------------------------------------------------------------------
  boundary-check:
    name: Module Boundary Check
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Check module boundaries
        run: python scripts/check_boundaries.py --src src

  # ---------------------------------------------------------------------------
  # Stage 3 — Unit tests + coverage gates
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: boundary-check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit/ tests/invariants/ \
            --cov=src/libs/contracts \
            --cov=src/libs/invariants \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v

      - name: Enforce coverage gate — contracts ≥90%
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          for pkg in root.iter('package'):
              name = pkg.get('name', '')
              if 'contracts' in name:
                  rate = float(pkg.get('line-rate', 0)) * 100
                  print(f'Contracts coverage: {rate:.1f}%')
                  assert rate >= 90, f'Contracts coverage {rate:.1f}% < 90% gate'
          print('Coverage gate: PASSED')
          "

      - name: Enforce coverage gate — invariants 100%
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          for pkg in root.iter('package'):
              name = pkg.get('name', '')
              if 'invariants' in name:
                  rate = float(pkg.get('line-rate', 0)) * 100
                  print(f'Invariants coverage: {rate:.1f}%')
                  assert rate >= 100, f'Invariants coverage {rate:.1f}% < 100% gate'
          print('Coverage gate: PASSED')
          "

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Stage 4 — Integration tests (Postgres, Redis, MongoDB via Docker Compose)
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services: {}  # Overridden by docker compose below

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Start Docker Compose services
        run: |
          # Only start the DB services; skip monitoring services for CI
          docker compose up -d postgres redis mongodb
          echo "Waiting for services to be healthy..."

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U voiceos -d voiceos_dev; then
              echo "Postgres ready"
              break
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 3
          done

      - name: Wait for Redis
        run: |
          for i in $(seq 1 20); do
            if docker compose exec -T redis redis-cli ping | grep -q PONG; then
              echo "Redis ready"
              break
            fi
            echo "Waiting for Redis... ($i/20)"
            sleep 2
          done

      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T mongodb mongosh --quiet --eval \
                "try { db.adminCommand('ping').ok } catch(e) { 0 }" 2>/dev/null \
                | grep -q "^1"; then
              echo "MongoDB ready"
              # Initialise replica set
              docker compose exec -T mongodb mongosh --quiet --eval \
                "try { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) } catch(e) {}" \
                2>/dev/null || true
              break
            fi
            echo "Waiting for MongoDB... ($i/30)"
            sleep 3
          done

      - name: Run integration tests
        env:
          POSTGRES_DSN: postgresql://voiceos:voiceos_dev_pw@localhost:5432/voiceos_dev
          REDIS_URL: redis://localhost:6379/0
          MONGODB_URI: mongodb://localhost:27017/voiceos_dev
        run: |
          pytest tests/integration/ -v --tb=short

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # Stage 5 — Secrets scan (gitleaks + trufflehog, Sprint-019 V4 Ch7 §7.12)
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true  # Non-blocking until license configured

      - name: Install trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --version

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: check_secrets.py — regex + trufflehog scan (blocking, Sprint-019)
        run: python scripts/check_secrets.py src/ tests/ scripts/

  # ---------------------------------------------------------------------------
  # Stage 6 — Docker build verification
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Verify docker-compose.yml is valid
        run: docker compose config --quiet

  # ---------------------------------------------------------------------------
  # Stage 7 — Performance Regression Gate (Sprint-028 V3 Ch19)
  #
  # Runs RegressionDetector unit tests to verify:
  #   - fixture timings within budget → PASS
  #   - simulated 15 % STT regression → CI gate FAILS (correct behavior)
  #
  # A future Phase 2 step will run this against real benchmark results
  # stored in the production Postgres performance_baselines table.
  # ---------------------------------------------------------------------------
  performance-regression-gate:
    name: Performance Regression Gate
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run performance regression gate unit tests
        run: |
          pytest tests/unit/libs/test_performance_engineering.py -v \
            --cov=src/libs/performance_engineering \
            --cov-report=term-missing \
            --cov-report=xml:coverage-perf.xml

      - name: Enforce performance engineering coverage ≥ 85 %
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage-perf.xml')
          root = tree.getroot()
          found = False
          for pkg in root.iter('package'):
              name = pkg.get('name', '')
              if 'performance_engineering' in name:
                  rate = float(pkg.get('line-rate', 0)) * 100
                  print(f'Performance engineering coverage: {rate:.1f}%')
                  assert rate >= 85, f'Coverage {rate:.1f}% < 85% gate'
                  found = True
          if not found:
              # Overall coverage check as fallback
              rate = float(root.get('line-rate', 0)) * 100
              print(f'Overall coverage: {rate:.1f}%')
              assert rate >= 85, f'Coverage {rate:.1f}% < 85% gate'
          print('Performance engineering coverage gate: PASSED')
          "

      - name: Verify regression gate catches simulated regression
        run: |
          python -c "
          from src.libs.performance_engineering.benchmarks import BenchmarkSuite, RegressionFixtureTimingSource, FixtureTimingSource
          from src.libs.performance_engineering.profiler import InMemoryBaselineRepository
          from src.libs.performance_engineering.regression_gate import RegressionDetector
          from datetime import date

          # Build a baseline from good fixture timings
          good = BenchmarkSuite(source=FixtureTimingSource()).run_benchmarks('baseline')
          store = InMemoryBaselineRepository()
          today = date.today()
          for s in good.stages:
              store.record(s.stage, s.p50_ms, s.p95_ms, s.p99_ms, today)

          # Run with regressed source (STT * 1.15)
          regressed = BenchmarkSuite(source=RegressionFixtureTimingSource()).run_benchmarks('regressed')
          result = RegressionDetector(store).check(regressed)

          assert not result.passed, 'ERROR: 15% regression was NOT detected — gate is broken'
          failed = [r.stage for r in result.failed_stages]
          assert 'stt' in failed, f'STT regression not detected; failed: {failed}'
          print(f'Regression gate correctly caught 15% regression in stages: {failed}')
          print('Performance regression gate: WORKING CORRECTLY')
          "
