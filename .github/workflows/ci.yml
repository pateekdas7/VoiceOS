name: VoiceOS CI

on:
  push:
    branches: ["main", "feature/**", "fix/**", "hotfix/**"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 — Static analysis (ruff + mypy)
  # ---------------------------------------------------------------------------
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: ruff — lint
        run: ruff check src/ tests/

      - name: ruff — format check
        run: ruff format --check src/ tests/

      - name: mypy — strict type checking
        run: mypy --strict src/ tests/

      - name: check_pii_logs.py — StructuredLogger never emits raw PII (blocking, Sprint-020)
        run: python scripts/check_pii_logs.py

  # ---------------------------------------------------------------------------
  # Stage 2 — Module boundary check (V6 Ch2 enforcement)
  # ---------------------------------------------------------------------------
  boundary-check:
    name: Module Boundary Check
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Check module boundaries
        run: python scripts/check_boundaries.py --src src

  # ---------------------------------------------------------------------------
  # Stage 3 — Unit tests + coverage gates
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    needs: boundary-check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        env:
          # Distinct data-file name so this job's raw coverage data can be
          # combined with integration-tests' below without collision.
          # --cov-fail-under=0 overrides pyproject.toml's global fail_under=85
          # for THIS invocation only — this job exercises unit+invariants tests
          # alone, a partial slice of src/, so the 85% *overall* gate must not
          # be evaluated here. It is enforced for real in the combined-coverage
          # job below, against unit+integration data together.
          COVERAGE_FILE: coverage-unit.data
        run: |
          pytest tests/unit/ tests/invariants/ \
            --cov=src/libs/contracts \
            --cov=src/libs/invariants \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=0 \
            -v

      - name: Enforce coverage gate — contracts ≥90%
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          for pkg in root.iter('package'):
              name = pkg.get('name', '')
              if 'contracts' in name:
                  rate = float(pkg.get('line-rate', 0)) * 100
                  print(f'Contracts coverage: {rate:.1f}%')
                  assert rate >= 90, f'Contracts coverage {rate:.1f}% < 90% gate'
          print('Coverage gate: PASSED')
          "

      - name: Enforce coverage gate — invariants 100%
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          for pkg in root.iter('package'):
              name = pkg.get('name', '')
              if 'invariants' in name:
                  rate = float(pkg.get('line-rate', 0)) * 100
                  print(f'Invariants coverage: {rate:.1f}%')
                  assert rate >= 100, f'Invariants coverage {rate:.1f}% < 100% gate'
          print('Coverage gate: PASSED')
          "

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload raw coverage data (unit)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-data-unit
          path: coverage-unit.data
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Stage 4 — Integration tests (Postgres, Redis, MongoDB via Docker Compose)
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services: {}  # Overridden by docker compose below

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Start Docker Compose services
        run: |
          # Only start the DB services; skip monitoring services for CI
          docker compose up -d postgres redis mongodb
          echo "Waiting for services to be healthy..."

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U voiceos -d voiceos_dev; then
              echo "Postgres ready"
              break
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 3
          done

      - name: Wait for Redis
        run: |
          for i in $(seq 1 20); do
            if docker compose exec -T redis redis-cli ping | grep -q PONG; then
              echo "Redis ready"
              break
            fi
            echo "Waiting for Redis... ($i/20)"
            sleep 2
          done

      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T mongodb mongosh --quiet --eval \
                "try { db.adminCommand('ping').ok } catch(e) { 0 }" 2>/dev/null \
                | grep -q "^1"; then
              echo "MongoDB ready"
              # Initialise replica set
              docker compose exec -T mongodb mongosh --quiet --eval \
                "try { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) } catch(e) {}" \
                2>/dev/null || true
              break
            fi
            echo "Waiting for MongoDB... ($i/30)"
            sleep 3
          done

      - name: Run integration tests
        env:
          POSTGRES_DSN: postgresql://voiceos:voiceos_dev_pw@localhost:5432/voiceos_dev
          REDIS_URL: redis://localhost:6379/0
          MONGODB_URI: mongodb://localhost:27017/voiceos_dev
          # Distinct data-file name so this job's raw coverage data can be
          # combined with unit-tests' above without collision. --cov-fail-under=0
          # overrides pyproject.toml's global fail_under=85 for THIS invocation
          # only — this job exercises integration tests alone, a partial slice
          # of src/, so the 85% *overall* gate must not be evaluated here. It is
          # enforced for real in the combined-coverage job below.
          COVERAGE_FILE: coverage-integration.data
        run: |
          pytest tests/integration/ -v --tb=short --cov-fail-under=0

      - name: Upload raw coverage data (integration)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-data-integration
          path: coverage-integration.data
          if-no-files-found: error

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # Stage 4.5 — Combined coverage gate (unit + integration combined, ≥85% overall)
  #
  # unit-tests and integration-tests each exercise only a slice of src/ and run
  # on separate runners, so each disables its own coverage fail-under
  # (--cov-fail-under=0) and instead uploads its raw .data file. This job
  # downloads both, merges them with `coverage combine` (pyproject.toml's
  # [tool.coverage.paths] already maps both runners' checkout paths to `src`),
  # and enforces pyproject.toml's [tool.coverage.report] fail_under=85 against
  # the true combined total — the "overall project minimum" the config's own
  # comment describes.
  # ---------------------------------------------------------------------------
  coverage-gate:
    name: Combined Coverage Gate
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Download unit coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-data-unit

      - name: Download integration coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-data-integration

      - name: Combine coverage and enforce overall 85% gate
        run: |
          coverage combine coverage-unit.data coverage-integration.data
          coverage report --fail-under=85 -m
          coverage xml -o coverage-combined.xml

      - name: Upload combined coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage-combined.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Stage 5 — Secrets scan (gitleaks + trufflehog, Sprint-019 V4 Ch7 §7.12)
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true  # Non-blocking until license configured

      - name: Install trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --version

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: check_secrets.py — regex + trufflehog scan (blocking, Sprint-019)
        run: python scripts/check_secrets.py src/ tests/ scripts/

  # ---------------------------------------------------------------------------
  # Stage 6 — Docker build verification
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Verify docker-compose.yml is valid
        run: docker compose config --quiet
