# VoiceOS v2 -- FluentBit DaemonSet (Sprint-027, V7 Ch9).
#
# One FluentBit pod per node (single-node cluster today); reads every
# other namespace's container logs from the node's local
# /var/log/containers, so it needs its own RBAC (read pod/namespace
# metadata cluster-wide) and a hostPath mount rather than a network call
# to other namespaces' pods.
#
# The RBAC below is currently unused by monitoring/logging/fluentbit.conf
# (its `kubernetes` filter was removed -- see that file's own comment,
# TT-015's apiserver-NAT limitation applies here too) but is left in
# place, ready for when that filter can be re-enabled.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentbit
  namespace: voiceos-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: voiceos-fluentbit
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: voiceos-fluentbit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: voiceos-fluentbit
subjects:
  - kind: ServiceAccount
    name: fluentbit
    namespace: voiceos-ops
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentbit
  namespace: voiceos-ops
  labels:
    app.kubernetes.io/name: fluentbit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluentbit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluentbit
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2020"
        prometheus.io/path: "/api/v1/metrics/prometheus"
    spec:
      serviceAccountName: fluentbit
      priorityClassName: high
      containers:
        - name: fluentbit
          image: "fluent/fluent-bit:3.1.9"
          ports:
            - name: metrics
              containerPort: 2020
          resources:
            requests:
              cpu: "20m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluentbit.conf
            - name: config
              mountPath: /fluent-bit/etc/parsers.conf
              subPath: parsers.conf
            - name: varlog
              mountPath: /var/log/containers
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: db
              mountPath: /var/log
      volumes:
        - name: config
          configMap:
            name: fluentbit-config
        - name: varlog
          hostPath:
            path: /var/log/containers
        # `/var/log/containers/*.log` are symlinks to
        # `/var/log/pods/<ns>_<pod>_<uid>/<container>/<n>.log` (absolute
        # paths) -- without this second mount, every symlink is dangling
        # *inside* the container and the tail input logs "skip (invalid)
        # entry" for every single file (found live: zero records ever
        # reached Loki, not a parser or NetworkPolicy issue as first
        # suspected).
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: db
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fluentbit
  namespace: voiceos-ops
  labels:
    app.kubernetes.io/name: fluentbit
spec:
  selector:
    app.kubernetes.io/name: fluentbit
  ports:
    - name: metrics
      port: 2020
      targetPort: metrics
