# VoiceOS v2 -- Prometheus Deployment (Sprint-027, V7 Ch7).
#
# Configuration is mounted from a ConfigMap generated at deploy time from
# monitoring/prometheus/ (see infra/k8s/observability/deploy.sh) -- the
# YAML/rule files under monitoring/prometheus/ remain the single source
# of truth; this manifest never duplicates their contents.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: voiceos-ops
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: voiceos-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      priorityClassName: high
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: "prom/prometheus:v2.54.1"
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=30d"
            - "--web.enable-lifecycle"
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/alert_rules
            - name: targets
              mountPath: /etc/prometheus/targets
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: targets
          configMap:
            name: prometheus-targets
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: voiceos-ops
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: voiceos-prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: voiceos-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: voiceos-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: voiceos-ops
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: voiceos-ops
  labels:
    app.kubernetes.io/name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
