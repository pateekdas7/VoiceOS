# VoiceOS v2 -- Grafana Deployment (Sprint-027, V7 Ch7).
#
# Dashboards + datasource provisioning are mounted from ConfigMaps
# generated at deploy time from monitoring/grafana/ (see
# infra/k8s/observability/deploy.sh) -- monitoring/grafana/dashboards/
# remains the single source of truth.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: voiceos-ops
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: voiceos-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      priorityClassName: high
      containers:
        - name: grafana
          image: "grafana/grafana:11.2.2"
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provisioning
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards-main
              mountPath: /etc/grafana/provisioning/voiceos-dashboards
            - name: dashboards-governance
              mountPath: /etc/grafana/provisioning/voiceos-dashboards/governance
            - name: dashboards-security
              mountPath: /etc/grafana/provisioning/voiceos-dashboards/security
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provisioning
          configMap:
            name: grafana-dashboard-provisioning
        - name: dashboards-main
          configMap:
            name: grafana-dashboards-main
        - name: dashboards-governance
          configMap:
            name: grafana-dashboards-governance
        - name: dashboards-security
          configMap:
            name: grafana-dashboards-security
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: voiceos-ops
  labels:
    app.kubernetes.io/name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
