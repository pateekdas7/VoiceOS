# stt -- generated by scripts/helm/generate_service_charts.sh, do not hand-edit.
enabled: true
namespace: voiceos-runtime
environment: dev
nodePool: cpu
priorityClassName: critical

image:
  repository: voiceos/stt
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  port: 8100

resources:
  cpu: "500m"
  memory: "512Mi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

gpu:
  tolerate: false

serviceAccount:
  automountToken: false

networkPolicy:
  egressPorts:
    - 5432
    - 6379
  allowedNamespaces:
    - voiceos-ops

config: {}
