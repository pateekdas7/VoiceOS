apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "voiceos.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "voiceos.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "voiceos.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Explicit allow-list: same-namespace traffic on this service's own port,
    # plus any additional namespaces this service's values.yaml names (e.g.
    # voiceos-runtime -> voiceos-platform requires an explicit cross-namespace
    # policy, per Sprint-026.md's Networking Validation). Everything else is
    # denied by the namespace's own deny-all-default policy
    # (infra/k8s/cluster-policies/default-deny.yaml).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- range .Values.networkPolicy.allowedNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - protocol: TCP
          port: {{ $.Values.service.port }}
    {{- end }}
  egress:
    # DNS is always required for service discovery.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- range .Values.networkPolicy.egressPorts }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ . }}
    {{- end }}
