{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "voiceos.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "voiceos.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "voiceos.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.gpu.tolerate }}
    # GPU-adjacent services scale on a custom metric (GPU Scheduler queue
    # depth), not raw CPU -- CPU utilization on a GPU-bound process is a
    # poor proxy for whether it needs another replica (Sprint-026.md:
    # "custom metrics for GPU-adjacent services").
    - type: Pods
      pods:
        metric:
          name: {{ .Values.autoscaling.customMetricName | default "voiceos_gpu_scheduler_queue_depth" }}
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.customMetricTarget | default "10" | quote }}
    {{- else }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage | default 70 }}
    {{- end }}
{{- end }}
