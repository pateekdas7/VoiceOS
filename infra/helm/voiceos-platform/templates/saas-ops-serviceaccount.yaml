{{- if .Values.saasOps.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "voiceos-platform.saasOps.fullname" . }}
  namespace: {{ .Values.saasOps.namespace }}
  labels:
    {{- include "voiceos-platform.saasOps.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
