{{- if .Values.saasOps.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "voiceos-platform.saasOps.fullname" . }}
  namespace: {{ .Values.saasOps.namespace }}
  labels:
    {{- include "voiceos-platform.saasOps.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.saasOps.replicaCount }}
  selector:
    matchLabels:
      {{- include "voiceos-platform.saasOps.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "voiceos-platform.saasOps.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.saasOps.service.port | quote }}
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "voiceos-platform.saasOps.fullname" . }}
      priorityClassName: {{ .Values.saasOps.priorityClassName }}
      nodeSelector:
        voiceos.io/node-pool: cpu
      containers:
        - name: saas-ops
          image: "{{ .Values.saasOps.image.repository }}:{{ .Values.saasOps.image.tag }}"
          imagePullPolicy: {{ .Values.saasOps.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.saasOps.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.saasOps.service.port | quote }}
          resources:
            requests:
              cpu: {{ .Values.saasOps.resources.cpu }}
              memory: {{ .Values.saasOps.resources.memory }}
            limits:
              cpu: {{ .Values.saasOps.resources.cpu }}
              memory: {{ .Values.saasOps.resources.memory }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      securityContext:
        runAsNonRoot: true
{{- end }}
