# voiceos-platform umbrella chart -- default values (Sprint-026)
#
# Per-service overrides live under each service's own key here (Helm's
# standard "child chart values nested under the child's name" convention),
# e.g.:
#
#   stt:
#     replicaCount: 4
#
# environment-specific overrides (dev/staging/production) live in
# infra/helm/values/{dev,staging,production}-values.yaml and are passed via
# `helm upgrade --install ... -f infra/helm/values/<env>-values.yaml`.

global:
  environment: dev

# ---------------------------------------------------------------------------
# SaaSOpsService -- deployed directly by this umbrella chart (Sprint-026.md's
# own Phase 2 services table lists it as "K8s Deployment -- voiceos-platform",
# i.e. via the umbrella chart itself, not a 26th service sub-chart -- the
# sprint's literal charts/ listing names exactly 25 sub-charts, see
# infra/terraform/variables.tf's service_names comment for the same
# resolved count discrepancy).
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Background CronJobs (Phase 6 — Background Job Wiring)
# All three jobs share the same image (voiceos/jobs) and namespace.
# Each job uses Guaranteed QoS (requests == limits) and Forbid concurrency.
# ---------------------------------------------------------------------------
jobs:
  image:
    repository: voiceos/jobs
    tag: "latest"
    pullPolicy: IfNotPresent
  namespace: voiceos-platform
  # Low priority so CronJobs don't preempt serving pods under node pressure.
  priorityClassName: low-priority

  # 6a: HITL SLA Enforcer — polls every 60 s for breached SLA deadlines.
  slaEnforcer:
    enabled: true
    schedule: "*/1 * * * *"
    activeDeadlineSeconds: 120
    backoffLimit: 2
    resources:
      cpu: "100m"
      memory: "128Mi"

  # 6b: Daily Analytics Aggregation — aggregates previous day at 00:30 UTC.
  dailyAggregation:
    enabled: true
    schedule: "30 0 * * *"
    activeDeadlineSeconds: 600
    backoffLimit: 1
    resources:
      cpu: "250m"
      memory: "256Mi"

  # 6c: Monthly Invoice Generation — generates invoices on the 1st at 01:00 UTC.
  monthlyInvoicing:
    enabled: true
    schedule: "0 1 1 * *"
    activeDeadlineSeconds: 1800
    backoffLimit: 1
    resources:
      cpu: "200m"
      memory: "256Mi"

# ---------------------------------------------------------------------------
# SaaSOpsService
# ---------------------------------------------------------------------------
saasOps:
  enabled: true
  namespace: voiceos-platform
  priorityClassName: normal
  image:
    repository: voiceos/saas-ops
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    port: 8042
  resources:
    cpu: "250m"
    memory: "256Mi"
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
