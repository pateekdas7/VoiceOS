# Grafana datasource provisioning — Prometheus
#
# Auto-provisions the Prometheus datasource so dashboards load without
# manual configuration after docker compose up.
#
# Architecture: V7 Ch7 (Grafana dashboards); Sprint-027.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
