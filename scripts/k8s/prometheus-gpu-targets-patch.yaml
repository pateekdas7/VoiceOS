# Prometheus ConfigMap patch — GPU scrape targets via WireGuard (10.99.0.2).
#
# Apply with:
#   kubectl get configmap prometheus-config -n voiceos-ops -o yaml > /tmp/prom-cm.yaml
#   python3 scripts/k8s/apply-prometheus-gpu-patch.py
#   kubectl apply -f /tmp/prom-cm-patched.yaml
#
# GPU WireGuard IP: 10.99.0.2  (CPU side: 10.99.0.1)
# Ports: LLM=8000, STT=8100, TTS=8200, Evaluator=8300
# Health paths: LLM=/health, STT=/health/ready, TTS=/health/ready, Eval=/health/ready
# Metrics paths: LLM=/metrics, STT=/metrics, TTS=/metrics, Eval=N/A

gpu_node_scrape_config: |
  - job_name: gpu-node
    static_configs:
      - targets:
          - "10.99.0.2:8000"   # LLM (vLLM / Qwen2.5-7B-FP8)
          - "10.99.0.2:8100"   # STT (Whisper large-v3-turbo)
          - "10.99.0.2:8200"   # TTS (Veena FP16 + SNAC 24kHz)
        labels:
          node_pool: gpu
          cluster_member: "false"
          gpu_host: "69.19.140.92"
