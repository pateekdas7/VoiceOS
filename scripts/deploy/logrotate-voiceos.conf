# VoiceOS log rotation configuration
# Install: sudo cp logrotate-voiceos.conf /etc/logrotate.d/voiceos

/var/log/voiceos/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root adm
    sharedscripts
    postrotate
        systemctl kill -s HUP voiceos-bff voiceos-webapi voiceos-frontend voiceos-voice-runtime voiceos-dialer-worker 2>/dev/null || true
    endscript
}

/var/log/voiceos/watchdog.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root adm
}
