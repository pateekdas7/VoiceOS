upstream frontend { server 127.0.0.1:3000; }
upstream bff      { server 127.0.0.1:8000; }
upstream webapi   { server 127.0.0.1:8001; }
upstream media_gw { server 127.0.0.1:8010; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── W10: Security headers applied at proxy layer ──────────────────────────────
# These complement per-service headers and ensure coverage even if a service
# forgets to set them.  HSTS is commented out here because it requires TLS
# termination at this layer — enable once an SSL cert is provisioned.
add_header X-Content-Type-Options    "nosniff"                       always;
add_header X-Frame-Options           "DENY"                          always;
add_header X-XSS-Protection          "0"                             always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Uncomment after TLS cert is provisioned:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ── W10: Block direct access to internal service ports via Host header ────
    # Only the paths below are routed — all others return 444 (silent drop).

    location /bff/ {
        proxy_pass http://bff/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    location /webapi/ {
        proxy_pass http://webapi/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://media_gw/;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
