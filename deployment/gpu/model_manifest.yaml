# ==============================================================================
# VoiceOS GPU Node — Model Manifest
# Defines all AI models, their download sources, local paths, and VRAM budgets.
# Updated after every sprint that introduces GPU model changes.
# Used by restore.sh → download_models.py to rebuild the GPU node.
# ==============================================================================

manifest_version: "1.3"
last_updated: "2026-08-03 (Sprint-029 Phase-2 GPU Runtime Redesign)"

# ── GPU node hardware ─────────────────────────────────────────────────────────
# UPDATED 2026-08-03: Hardware changed from NVIDIA L4 → NVIDIA RTX A6000.
# A6000 provisioned 2026-07-19. VRAM nearly 2× larger; gpu_memory_utilization
# recalibrated from 0.55 → 0.32 accordingly. Evaluator (15.3 GiB) now fits.
gpu:
  model: "NVIDIA RTX A6000"
  architecture: "Ampere"
  cuda_compute_capability: "8.6"    # sm_86 (NOT Ada Lovelace; no HW FP8)
  vram_mb: 46068                    # nvidia-smi; spec is 48 GiB = 49152 MiB
  driver_version: "570.x"           # Driver 570+ (CUDA 12.8 native + CUDA 13.0 compat)
  cuda_compat: "13.0"               # cuda-compat-13-0 package; LD_LIBRARY_PATH set in systemd
  ip: "185.216.21.242"              # Production node IP (subject to change on re-provisioning)

# ── Runtime stack (pinned versions) ──────────────────────────────────────────
runtime:
  python: "3.12.13"
  torch: "2.11.0+cu128"         # cu128 = CUDA 12.8 PyTorch build
  cuda: "12.8"                  # torch.version.cuda (PyTorch CUDA build version)
  cudnn: "9.19.0"               # torch.backends.cudnn.version() → 91900
  vllm: "0.24.0"
  faster_whisper: "1.2.1"
  ctranslate2: "4.8.0"
  transformers: "5.12.1"
  tokenizers: "0.22.2"
  flashinfer: "0.6.12"
  triton: "3.6.0"
  numpy: "2.3.5"

# ── VRAM budget ───────────────────────────────────────────────────────────────
# Actual GPU capacity: 23,034 MB
# Three-model allocation (MEASURED Sprint-009 Phase 2, 2026-07-03):
#   Whisper int8_float16:  1,242 MB loaded  (6,144 MB reserved in scheduler for headroom)
#   Qwen FP8 (vLLM @0.55): 12,628 MB        (16,384 MB reserved)
#   Veena 3B BF16 + SNAC:  7,980 MB         (2,048 MB reserved)
#   Measured total:        21,850 MB used / 695 MB free
#   vLLM util reduced 0.70 → 0.55 to make room for Veena 3B BF16 (larger than the 2 GB estimate).
vram_budget_mb: 46068           # A6000 (nvidia-smi); was 23034 on L4
vram_budget_spec_mb: 49152      # 48 GiB spec; was 24576 on L4
# A6000 allocation (STT + LLM@0.32 + TTS):
#   STT:   1,860 MB (model + ctranslate2 workspace)
#   LLM:  14,742 MB (weights 8.17G + KV 5.72G + CUDA graphs 0.51G @ 0.32 util)
#   TTS:   7,980 MB (Veena 3B BF16 + SNAC)
#   Total: 24,582 MB used / 21,486 MB free
# With evaluator (Sprint-029):
#   Evaluator: 15,360 MB  → Total ~39,942 MB / ~6,126 MB free
vram_measured_used_mb: 24582    # Sprint-029 Phase 2, STT+LLM+TTS (evaluator excluded)

# ── Models ────────────────────────────────────────────────────────────────────
# PRODUCTION BASELINE — locked 2026-07-02.
# Do NOT change model names, repos, or quantization without explicit approval.
models:

  # ── STT: Whisper Large-v3 Turbo ────────────────────────────────────────────
  - name: whisper-large-v3-turbo
    purpose: Speech-to-Text (STT)
    introduced_in: Sprint-009

    # IMPORTANT: faster-whisper 1.2.1 maps the size string "large-v3-turbo"
    # to mobiuslabsgmbh/faster-whisper-large-v3-turbo (CTranslate2-format binary).
    # download_models.py uses faster_whisper.download_model(), NOT huggingface_hub.
    # The openai/whisper-large-v3-turbo safetensors repo is NOT used here.
    local_path: /opt/voiceos-gpu/models/whisper-large-v3-turbo/
    cache_path: /opt/voiceos-gpu/cache/whisper/

    download:
      method: faster_whisper
      model_size: large-v3-turbo
      # Resolves to: mobiuslabsgmbh/faster-whisper-large-v3-turbo
      # Actual HF host: dropbox-dash/faster-whisper-large-v3-turbo
      download_size_mb: 1547       # model.bin 1,542.9 MB + tokenizer files
      format: ctranslate2          # pre-converted binary, NOT safetensors

    # compute_type is a runtime parameter to WhisperModel(), not a download option.
    # FP8 is NOT supported by CTranslate2 4.8.0 on NVIDIA L4 (SM 8.9).
    # int8_float16 is the most memory-efficient available compute type.
    compute_type: int8_float16     # INT8 weights, FP16 activations

    vram_mb: 6144                  # scheduler reservation; actual loaded: 1,242 MB (measured)
    port: 8100
    server_script: /opt/voiceos-gpu/services/stt/server.py   # Sprint-009 FastAPI wrapper
    endpoints: ["/health/live", "/health/ready", "/transcribe"]
    health_check: "curl -sf http://localhost:8100/health/ready"
    latency_target_ms:
      first_word_p95: 500
    measured_latency_ms: 330       # Sprint-009 Phase 2 on synthetic audio
    streaming: true

  # ── LLM: Qwen2.5-7B FP8 ───────────────────────────────────────────────────
  - name: qwen2.5-7b-instruct-fp8
    purpose: LLM response generation
    introduced_in: Sprint-009

    # IMPORTANT: Qwen/Qwen2.5-7B-Instruct-FP8 does NOT exist on HuggingFace.
    # RedHatAI/Qwen2.5-7B-Instruct-FP8-dynamic is the production-ready FP8 repo:
    #   - Actively maintained (last updated 2026-06-09)
    #   - W8A8 FP8: weights=float8 (channel-sym), activations=float8 (token-sym dynamic)
    #   - Uses compressed-tensors format, auto-detected by vLLM
    #   - No --dtype or --quantization flag needed; vLLM reads quantization_config
    local_path: /opt/voiceos-gpu/models/qwen2.5-7b-fp8/
    cache_path: /opt/voiceos-gpu/cache/qwen/

    download:
      method: huggingface
      repo_id: RedHatAI/Qwen2.5-7B-Instruct-FP8-dynamic
      download_size_mb: 8306       # two safetensors shards: 4755 + 3551 MB
      format: safetensors
      ignore_patterns:
        - "*.pt"
        - "*.gguf"

    startup:
      # No --dtype or --quantization flags: vLLM auto-detects compressed-tensors FP8
      # from the model's quantization_config in config.json.
      # --dtype auto reads torch_dtype=bfloat16 from model config (non-quantized ops).
      # --gpu-memory-utilization 0.32: calibrated for A6000 (46,068 MiB) on 2026-07-18.
      #   Weights: 8.17 GiB | CUDA graphs: 0.51 GiB | KV cache: 5.72 GiB
      #   26 concurrent sessions at max 4096 tokens; 79 at typical 1,350 tokens.
      #   Freed ~10.2 GiB vs 0.55 with no TTFT or throughput impact.
      command: >
        /opt/voiceos-gpu/venv/bin/vllm serve /opt/voiceos-gpu/models/qwen2.5-7b-fp8/
          --dtype auto
          --port 8000
          --max-model-len 4096
          --gpu-memory-utilization 0.32
          --served-model-name qwen2.5-7b-instruct-fp8

    # NOTE: --gpu-memory-utilization history:
    #   0.70 → 0.55: Sprint-009 Phase 2, to fit Veena 3B BF16 on 23 GB L4.
    #   0.55 → 0.32: 2026-07-18, A6000 (46 GB). At 0.55 vLLM claimed 25 GB (15.9 GB KV
    #               cache, 72× concurrency) — overprovisioned for VoiceOS voice workload.
    #               0.32 gives 5.72 GB KV cache (26× @ 4096 tok), sufficient and measured.
    vram_mb: 10240                 # scheduler reservation; actual ~14,742 MiB total (weights+KV+graphs)
    port: 8000
    health_check: "curl -sf http://localhost:8000/health"
    latency_target_ms:
      ttft_p95: 500
    measured_ttft_ms: 57           # Phase 0 A6000 measurement (was 208ms on L4)
    streaming: true

  # ── TTS: Veena (3B BF16) + SNAC 24 kHz codec ───────────────────────────────
  - name: veena-tts
    purpose: Text-to-Speech (TTS) — Hindi/Hinglish/English
    introduced_in: Sprint-009

    local_path: /opt/voiceos-gpu/models/veena-fp16/    # dir name retained; weights are BF16
    cache_path: /opt/voiceos-gpu/cache/

    download:
      # Sprint-009 Phase 2: internal registry (models.voiceos.internal/veena-fp16) was
      # unavailable (requires VPN). Switched to the public maya-research/Veena repo.
      # Veena is a 3B LlamaForCausalLM that emits SNAC codec tokens (BF16, NOT FP16).
      method: huggingface
      repo_id: maya-research/Veena
      precision: bfloat16
      format: safetensors
      params: 3B

    # SNAC codec is a required companion — decodes Veena's 7-token-per-frame output.
    companion_codec:
      name: snac-24khz
      repo_id: hubertsiuzdak/snac_24khz
      local_path: /opt/voiceos-gpu/models/snac-24khz/
      vq_strides: [4, 2, 1]        # → 1 + 2 + 4 = 7 tokens per frame
      codebook_size: 4096
      sample_rate: 24000

    # Veena token layout (verified against maya-research/Veena reference):
    veena_tokens:
      start_of_speech: 128257
      end_of_speech: 128258
      start_of_human: 128259
      end_of_human: 128260
      start_of_ai: 128261
      end_of_ai: 128262
      audio_code_base_offset: 128266
      prompt_format: "<spk_{speaker}> {text}"
      speakers: [kavya, agastya, maitri, vinaya]   # kavya = default

    vram_mb: 2048                  # scheduler reservation; actual Veena 3B + SNAC = 7,980 MB
    port: 8200
    server_script: /opt/voiceos-gpu/services/tts/server.py   # Sprint-009 FastAPI wrapper
    endpoints: ["/health/live", "/health/ready", "/synthesize"]
    health_check: "curl -sf http://localhost:8200/health/ready"
    latency_target_ms:
      first_clause_p95: 750         # ADR-004: revised from 300ms (V1 Ch23 original 250ms); Veena 3B minimum is 21 tok × 32.7ms = 642ms
    measured_rtf_warm: 2.3         # autoregressive; mitigated by clause-level streaming
    streaming: true                # clause-level (Veena has no within-clause token streaming)

  # ── FOUNDER EVALUATOR: Qwen2.5-Omni-7B (NOT production — Sprint-029 only) ──────
  - name: qwen2.5-omni-7b-evaluator
    purpose: Founder Audio Evaluation — Sprint-029 Founder Validation ONLY
    isolation: ISOLATED — not part of production STT/LLM/TTS pipeline. Never called by any production service. Port 8300 is internal only.
    introduced_in: Sprint-029

    local_path: /opt/voiceos-gpu/models/qwen2.5-omni-7b/
    cache_path: /opt/voiceos-gpu/cache/hf/

    download:
      method: huggingface
      repo_id: Qwen/Qwen2.5-Omni-7B
      precision: bfloat16
      format: safetensors
      download_size_gb: 21           # 5 safetensor shards + tokenizer + config
      ignore_patterns:
        - "*.msgpack"
        - "*.h5"
        - "flax_model*"

    startup:
      # enable_audio_output=False: disables the speech decoder (~1.5 GiB saved).
      # We only need audio-in (listening/evaluation), not audio-out (TTS).
      # device_map=auto: fills A6000 GPU first, then CPU offload if needed.
      command: >
        /opt/voiceos-gpu/venv/bin/python3 /opt/voiceos-gpu/services/evaluator/server.py

    vram_mb: 15360                 # ~14.5 GiB language model + ~0.8 GiB audio encoder (BF16, TTS decoder disabled)
    port: 8300
    server_script: /opt/voiceos-gpu/services/evaluator/server.py
    endpoints: ["/health/live", "/health/ready", "/evaluate"]
    health_check: "curl -sf http://localhost:8300/health/ready"
    additional_packages:
      - qwen-omni-utils>=0.0.9
      - soundfile>=0.14.0
      - librosa>=0.11.0
    latency_target_ms:
      evaluation_p95: 60000        # model inference for audio review; not latency-critical

# ── Startup order ──────────────────────────────────────────────────────────────
# vLLM startup takes ~90s (start first). Whisper ~7s. Veena + SNAC ~28s.
# Evaluator loads last (~3–5 min, not time-critical).
startup_order:
  - qwen2.5-7b-instruct-fp8       # vLLM ~90s startup — start first
  - whisper-large-v3-turbo        # 1,242 MB loaded — ~7s start
  - veena-tts                     # Veena 3B + SNAC — ~28s start
  - qwen2.5-omni-7b-evaluator     # Founder evaluator — ~3–5 min cold start (not production-critical)

# ── Post-restore validation ────────────────────────────────────────────────────
post_restore_validation:
  vram_check: true
  latency_check: true
  streaming_check: true
  commands:
    - "/opt/voiceos-gpu/venv/bin/python deployment/validate_latency.py --test stt"
    - "/opt/voiceos-gpu/venv/bin/python deployment/validate_latency.py --test llm"
    - "/opt/voiceos-gpu/venv/bin/python deployment/validate_latency.py --test tts"
    - "curl -sf http://localhost:8300/health/ready && echo 'Evaluator: OK'"
