[alembic]
# Sprint-014: Persistent Storage — Schemas & Migrations (V6 Ch7 expand-contract).
# Migration scripts live alongside the Sprint-002 raw-SQL schema files so both
# remain visible in one place; env.py resolves the real connection from
# POSTGRES_DSN at runtime rather than this file (no secrets committed here).
script_location = scripts/db/migrations/alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
