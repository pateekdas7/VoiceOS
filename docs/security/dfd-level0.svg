<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="monospace, sans-serif">
  <rect width="800" height="500" fill="#f8f9fa" rx="4"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">VoiceOS — Level 0 Data Flow Diagram</text>
  <text x="400" y="50" text-anchor="middle" font-size="11" fill="#555">Sprint-028 · V4 Ch20 · STRIDE Threat Model</text>

  <!-- ============================================================ -->
  <!-- External entities (rectangles, double-line border) -->
  <!-- ============================================================ -->

  <!-- Customer / PSTN -->
  <rect x="30" y="180" width="120" height="60" fill="#e8f4fd" stroke="#1e88e5" stroke-width="2" rx="4"/>
  <rect x="33" y="183" width="114" height="54" fill="none" stroke="#1e88e5" stroke-width="1" rx="3"/>
  <text x="90" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">Customer</text>
  <text x="90" y="222" text-anchor="middle" font-size="10" fill="#1565c0">(PSTN / SIP)</text>

  <!-- Collection Agent -->
  <rect x="30" y="300" width="120" height="60" fill="#e8f4fd" stroke="#1e88e5" stroke-width="2" rx="4"/>
  <rect x="33" y="303" width="114" height="54" fill="none" stroke="#1e88e5" stroke-width="1" rx="3"/>
  <text x="90" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">Agent</text>
  <text x="90" y="342" text-anchor="middle" font-size="10" fill="#1565c0">(Dashboard)</text>

  <!-- Admin -->
  <rect x="30" y="60" width="120" height="60" fill="#e8f4fd" stroke="#1e88e5" stroke-width="2" rx="4"/>
  <rect x="33" y="63" width="114" height="54" fill="none" stroke="#1e88e5" stroke-width="1" rx="3"/>
  <text x="90" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">Admin</text>
  <text x="90" y="102" text-anchor="middle" font-size="10" fill="#1565c0">(Portal)</text>

  <!-- External CRM -->
  <rect x="650" y="180" width="120" height="60" fill="#e8f4fd" stroke="#1e88e5" stroke-width="2" rx="4"/>
  <rect x="653" y="183" width="114" height="54" fill="none" stroke="#1e88e5" stroke-width="1" rx="3"/>
  <text x="710" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">Ext. CRM</text>
  <text x="710" y="222" text-anchor="middle" font-size="10" fill="#1565c0">(Webhooks)</text>

  <!-- Regulator / Auditor -->
  <rect x="650" y="300" width="120" height="60" fill="#e8f4fd" stroke="#1e88e5" stroke-width="2" rx="4"/>
  <rect x="653" y="303" width="114" height="54" fill="none" stroke="#1e88e5" stroke-width="1" rx="3"/>
  <text x="710" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">Auditor</text>
  <text x="710" y="342" text-anchor="middle" font-size="10" fill="#1565c0">(Compliance)</text>

  <!-- ============================================================ -->
  <!-- VoiceOS system boundary (large rounded rect) -->
  <!-- ============================================================ -->
  <rect x="200" y="100" width="400" height="300" fill="#fff" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="8,4" rx="12"/>
  <text x="400" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5e20">VoiceOS v2</text>
  <text x="400" y="143" text-anchor="middle" font-size="10" fill="#388e3c">Enterprise AI Voice Operating System</text>

  <!-- Process circle inside system -->
  <ellipse cx="400" cy="255" rx="80" ry="50" fill="#f1f8e9" stroke="#558b2f" stroke-width="2"/>
  <text x="400" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#33691e">AI Voice</text>
  <text x="400" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#33691e">Pipeline</text>

  <!-- ============================================================ -->
  <!-- Arrows — External entities to/from VoiceOS -->
  <!-- ============================================================ -->

  <!-- Customer → VoiceOS (Inbound Call / Audio) -->
  <line x1="150" y1="205" x2="200" y2="230" stroke="#1e88e5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="175" y="210" font-size="9" fill="#0d47a1">Audio RTP</text>
  <text x="175" y="221" font-size="9" fill="#0d47a1">SIP INVITE</text>

  <!-- VoiceOS → Customer (TTS playback) -->
  <line x1="200" y1="250" x2="150" y2="230" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="155" y="245" font-size="9" fill="#1b5e20">TTS Audio</text>

  <!-- Agent → VoiceOS (Dashboard API) -->
  <line x1="150" y1="320" x2="200" y2="290" stroke="#1e88e5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="155" y="314" font-size="9" fill="#0d47a1">REST API</text>

  <!-- VoiceOS → Agent (Notifications) -->
  <line x1="200" y1="300" x2="150" y2="340" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="155" y="335" font-size="9" fill="#1b5e20">Alerts</text>

  <!-- Admin → VoiceOS -->
  <line x1="150" y1="90" x2="200" y2="150" stroke="#1e88e5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="155" y="112" font-size="9" fill="#0d47a1">Admin mTLS</text>

  <!-- VoiceOS → Admin (Reports/Audit) -->
  <line x1="200" y1="160" x2="150" y2="105" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="155" y="148" font-size="9" fill="#1b5e20">Reports</text>

  <!-- VoiceOS → Ext CRM (Webhooks) -->
  <line x1="600" y1="240" x2="650" y2="220" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="604" y="240" font-size="9" fill="#1b5e20">Webhooks</text>

  <!-- VoiceOS → Auditor (Audit export) -->
  <line x1="600" y1="270" x2="650" y2="310" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="604" y="300" font-size="9" fill="#1b5e20">Audit logs</text>

  <!-- ============================================================ -->
  <!-- STRIDE threat annotations (on system boundary) -->
  <!-- ============================================================ -->
  <rect x="208" y="160" width="100" height="30" fill="#ffecb3" stroke="#f57f17" stroke-width="1" rx="3"/>
  <text x="258" y="174" text-anchor="middle" font-size="9" fill="#e65100">⚠ S-01 Caller-ID</text>
  <text x="258" y="185" text-anchor="middle" font-size="9" fill="#e65100">Spoofing</text>

  <rect x="210" y="340" width="100" height="30" fill="#ffecb3" stroke="#f57f17" stroke-width="1" rx="3"/>
  <text x="260" y="354" text-anchor="middle" font-size="9" fill="#e65100">⚠ S-02 JWT</text>
  <text x="260" y="365" text-anchor="middle" font-size="9" fill="#e65100">Forgery</text>

  <rect x="490" y="160" width="100" height="30" fill="#fce4ec" stroke="#c62828" stroke-width="1" rx="3"/>
  <text x="540" y="174" text-anchor="middle" font-size="9" fill="#b71c1c">⚠ T-07 Prompt</text>
  <text x="540" y="185" text-anchor="middle" font-size="9" fill="#b71c1c">Injection</text>

  <rect x="490" y="340" width="100" height="30" fill="#ede7f6" stroke="#4527a0" stroke-width="1" rx="3"/>
  <text x="540" y="354" text-anchor="middle" font-size="9" fill="#311b92">⚠ D-01 VRAM</text>
  <text x="540" y="365" text-anchor="middle" font-size="9" fill="#311b92">Exhaustion</text>

  <!-- ============================================================ -->
  <!-- Arrow markers -->
  <!-- ============================================================ -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1e88e5"/>
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="200" y="420" width="400" height="65" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
  <text x="210" y="437" font-size="10" font-weight="bold" fill="#333">Legend</text>
  <rect x="210" y="443" width="12" height="12" fill="#e8f4fd" stroke="#1e88e5" stroke-width="1.5"/>
  <text x="228" y="453" font-size="10" fill="#333">External entity</text>
  <rect x="310" y="443" width="12" height="12" fill="#fff" stroke="#2e7d32" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="328" y="453" font-size="10" fill="#333">System boundary</text>
  <rect x="430" y="443" width="12" height="12" fill="#ffecb3" stroke="#f57f17" stroke-width="1"/>
  <text x="448" y="453" font-size="10" fill="#333">STRIDE threat</text>
  <line x1="210" y1="465" x2="240" y2="465" stroke="#1e88e5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="248" y="469" font-size="10" fill="#333">Inbound data flow</text>
  <line x1="350" y1="465" x2="380" y2="465" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="388" y="469" font-size="10" fill="#333">Outbound data flow</text>
</svg>
