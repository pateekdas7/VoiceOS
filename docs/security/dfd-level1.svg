<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="title desc">
  <title id="title">VoiceOS v2 — Level 1 Data Flow Diagram</title>
  <desc id="desc">VoiceOS v2 decomposed into major components across trust zones (External, DMZ, Internal Service Mesh, GPU Tier, Data Tier, Observability), with data flows annotated with threat registry IDs.</desc>

  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1400" height="900" fill="#f8fafc"/>

  <text x="700" y="26" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="bold" fill="#111827">VoiceOS v2 — Component &amp; Trust-Zone View (DFD Level 1)</text>

  <!-- ================= External entities ================= -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="20" y="40" width="240" height="55" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="140" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Customer</text>
    <text x="140" y="80" text-anchor="middle" font-size="10.5" fill="#4b5563">(phone caller)</text>

    <rect x="290" y="40" width="240" height="55" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="410" y="59" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Collections Agent /</text>
    <text x="410" y="73" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Supervisor</text>
    <text x="410" y="88" text-anchor="middle" font-size="10.5" fill="#4b5563">(via Admin Portal)</text>

    <rect x="560" y="40" width="240" height="55" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="680" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Tenant Admin</text>
    <text x="680" y="80" text-anchor="middle" font-size="10.5" fill="#4b5563">(Admin Portal / Public API)</text>

    <rect x="830" y="40" width="240" height="55" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="950" y="59" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">External Webhook</text>
    <text x="950" y="73" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">Consumer</text>
    <text x="950" y="88" text-anchor="middle" font-size="10.5" fill="#4b5563">(tenant's CRM/systems)</text>

    <rect x="1100" y="40" width="240" height="55" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="1220" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Regulator / Auditor</text>
    <text x="1220" y="80" text-anchor="middle" font-size="10.5" fill="#4b5563">(read-only audit access)</text>
  </g>

  <!-- ================= DMZ zone ================= -->
  <rect x="10" y="105" width="1380" height="165" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="22" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#4338ca">TRUST ZONE: DMZ</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="20" y="145" width="300" height="90" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="170" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Media Gateway</text>
    <text x="170" y="192" text-anchor="middle" font-size="10.5" fill="#4b5563">SIP/RTP + Twilio WS ingress</text>
    <text x="170" y="206" text-anchor="middle" font-size="10.5" fill="#4b5563">ConnectionAuthenticator (AR-2)</text>

    <rect x="340" y="145" width="300" height="90" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="490" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Admin Portal</text>
    <text x="490" y="192" text-anchor="middle" font-size="10.5" fill="#4b5563">/admin/v1 — AdminRoleGateMiddleware</text>
    <text x="490" y="206" text-anchor="middle" font-size="10.5" fill="#4b5563">AuditMiddleware</text>

    <rect x="660" y="145" width="300" height="90" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="810" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Public API</text>
    <text x="810" y="192" text-anchor="middle" font-size="10.5" fill="#4b5563">/v1 — APIKeyValidator</text>
    <text x="810" y="206" text-anchor="middle" font-size="10.5" fill="#4b5563">APIRateLimiter</text>

    <rect x="980" y="145" width="300" height="90" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="1130" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Integration Platform</text>
    <text x="1130" y="192" text-anchor="middle" font-size="10.5" fill="#4b5563">WebhookDeliveryEngine</text>
    <text x="1130" y="206" text-anchor="middle" font-size="10.5" fill="#4b5563">WebhookSigner (HMAC)</text>
  </g>

  <!-- ================= Internal service mesh zone ================= -->
  <rect x="10" y="290" width="1380" height="165" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="22" y="307" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#047857">TRUST ZONE: INTERNAL SERVICE MESH (mTLS)</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="20" y="330" width="260" height="110" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="150" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Auth / AuthZ</text>
    <text x="150" y="376" text-anchor="middle" font-size="10.5" fill="#4b5563">JWTValidator · MTLSEnforcer</text>
    <text x="150" y="390" text-anchor="middle" font-size="10.5" fill="#4b5563">RBACEngine · TenantIsolationGuard</text>
    <text x="150" y="404" text-anchor="middle" font-size="10.5" fill="#4b5563">ABACEvaluator · JITPrivilege</text>

    <rect x="310" y="330" width="460" height="110" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="540" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Conversation Engine + Intelligence Engines</text>
    <text x="540" y="376" text-anchor="middle" font-size="10.5" fill="#4b5563">Intent · Strategy · Negotiation · Goal Planner</text>
    <text x="540" y="390" text-anchor="middle" font-size="10.5" fill="#4b5563">Risk Engine · CustomerContextAssembler (RI-5)</text>
    <text x="540" y="404" text-anchor="middle" font-size="10.5" fill="#4b5563">PromptInjectionDetector screening</text>

    <rect x="800" y="330" width="460" height="110" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="1030" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Policy Engine / AI Governance</text>
    <text x="1030" y="376" text-anchor="middle" font-size="10.5" fill="#4b5563">RBI · DPDP · Authorization · Billing packs</text>
    <text x="1030" y="390" text-anchor="middle" font-size="10.5" fill="#4b5563">AIGovernanceService.LawOfAuthorityChecker</text>
    <text x="1030" y="404" text-anchor="middle" font-size="10.5" fill="#4b5563">ExplainabilityEngine · ContentModerator</text>
  </g>

  <!-- ================= GPU tier zone ================= -->
  <rect x="10" y="470" width="1380" height="105" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="22" y="487" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">TRUST ZONE: GPU TIER (bare-metal, network-segmented)</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="460" y="505" width="480" height="60" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="700" y="527" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">GPU Tier</text>
    <text x="700" y="544" text-anchor="middle" font-size="10.5" fill="#4b5563">STT (Whisper) · LLM (Qwen2.5-7B/vLLM) · TTS (Veena) — VRAMLedger/AdmissionController (RI-8)</text>
  </g>

  <!-- ================= Data tier zone ================= -->
  <rect x="10" y="595" width="1380" height="105" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="22" y="612" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">TRUST ZONE: DATA TIER (authoritative state)</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="460" y="630" width="480" height="60" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="700" y="652" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Data Tier</text>
    <text x="700" y="669" text-anchor="middle" font-size="10.5" fill="#4b5563">Postgres (TenantIsolationGuard) · Redis (Event Bus) · MongoDB · Vault (KV+Transit)</text>
  </g>

  <!-- ================= Observability zone ================= -->
  <rect x="10" y="720" width="1380" height="95" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="22" y="737" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">CROSS-CUTTING: OBSERVABILITY</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="460" y="750" width="480" height="55" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="700" y="772" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Observability</text>
    <text x="700" y="789" text-anchor="middle" font-size="10.5" fill="#4b5563">Prometheus · Grafana · Alertmanager · Loki · Jaeger (Sprint-027)</text>
  </g>

  <!-- ================= Flows ================= -->
  <g stroke="#374151" stroke-width="1.6" fill="none">
    <!-- 1. Customer -> Media Gateway -->
    <line x1="150" y1="95" x2="165" y2="145" marker-end="url(#arrow1)"/>
    <!-- 2. Collections Agent -> Admin Portal -->
    <line x1="410" y1="95" x2="470" y2="145" marker-end="url(#arrow1)"/>
    <!-- 3. Tenant Admin -> Public API -->
    <line x1="700" y1="95" x2="790" y2="145" marker-end="url(#arrow1)"/>
    <!-- 4. Integration Platform -> Webhook Consumer -->
    <line x1="1150" y1="145" x2="990" y2="95" marker-end="url(#arrow1)"/>
    <!-- 5. Regulator -> Admin Portal (elbow, routed above DMZ boxes) -->
    <polyline points="1220,95 1220,116 510,116 510,145" marker-end="url(#arrow1)"/>

    <!-- 6. Media Gateway -> Auth/AuthZ -->
    <line x1="165" y1="235" x2="150" y2="330" marker-end="url(#arrow1)"/>
    <!-- 7. Admin Portal -> Auth/AuthZ -->
    <polyline points="470,235 470,300 165,300 165,330" marker-end="url(#arrow1)"/>
    <!-- 8. Public API -> Auth/AuthZ -->
    <polyline points="790,235 790,312 185,312 185,330" marker-end="url(#arrow1)"/>

    <!-- 9. Auth/AuthZ -> Conversation Engine -->
    <line x1="280" y1="385" x2="310" y2="385" marker-end="url(#arrow1)"/>
    <!-- 10. Conversation Engine <-> Policy Engine -->
    <line x1="770" y1="385" x2="800" y2="385" marker-end="url(#arrow1)"/>
    <line x1="800" y1="405" x2="770" y2="405" marker-end="url(#arrow1)"/>

    <!-- 11. Conversation Engine <-> GPU Tier -->
    <line x1="560" y1="440" x2="640" y2="505" marker-end="url(#arrow1)"/>
    <line x1="600" y1="505" x2="530" y2="440" marker-end="url(#arrow1)"/>

    <!-- 12. Conversation Engine -> Data Tier -->
    <line x1="500" y1="440" x2="560" y2="630" marker-end="url(#arrow1)"/>
    <!-- 13. Policy Engine -> Data Tier -->
    <line x1="960" y1="440" x2="840" y2="630" marker-end="url(#arrow1)"/>

    <!-- 14. Data Tier (event bus) -> Integration Platform (elbow up right margin) -->
    <polyline points="940,655 1375,655 1375,190 1280,190" marker-end="url(#arrow1)"/>

    <!-- 15/16/17. Cross-cutting telemetry into Observability -->
    <line x1="150" y1="440" x2="500" y2="750" marker-end="url(#arrow1)"/>
    <line x1="700" y1="565" x2="700" y2="750" marker-end="url(#arrow1)"/>
    <line x1="700" y1="690" x2="700" y2="750" marker-end="url(#arrow1)"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#1f2937">
    <text x="45" y="118">Voice call [THR-001, THR-002, THR-023]</text>
    <text x="290" y="130">Admin session [THR-027]</text>
    <text x="620" y="130">API key auth [THR-005]</text>
    <text x="1000" y="130">Webhook delivery (HMAC) [THR-006, THR-011]</text>
    <text x="760" y="112">Read-only audit trail query [THR-013]</text>

    <text x="10" y="272">Auth-before-</text>
    <text x="10" y="285">allocation (AR-2)</text>
    <text x="475" y="270">Admin JWT/OIDC</text>
    <text x="590" y="290">Public API key → AuthContext</text>

    <text x="285" y="380" text-anchor="end">AuthContext +</text>
    <text x="285" y="392" text-anchor="end">TenantIsolationGuard</text>

    <text x="775" y="378">Policy check /</text>
    <text x="775" y="420">DecisionEnvelope</text>
    <text x="775" y="432">[THR-009, THR-030]</text>

    <text x="555" y="475">STT/LLM/TTS</text>
    <text x="555" y="487">streaming</text>
    <text x="555" y="499">[THR-022, THR-024]</text>

    <text x="345" y="545">CRM/Collections</text>
    <text x="345" y="557">repository reads</text>
    <text x="345" y="569">[THR-017]</text>

    <text x="900" y="545">Policy/Audit</text>
    <text x="900" y="557">repository writes</text>
    <text x="900" y="569">[THR-007]</text>

    <text x="1290" y="420" text-anchor="middle" transform="rotate(-90 1290 420)">Event Bus fanout → webhook delivery [THR-008]</text>

    <text x="150" y="600">Metrics/traces/logs</text>
    <text x="150" y="612">(PII-redacted)</text>
    <text x="150" y="624">[THR-016]</text>
  </g>

  <!-- ================= Legend ================= -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#374151">
    <rect x="20" y="828" width="14" height="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="40" y="839">Trust zone boundary</text>
    <rect x="200" y="828" width="14" height="14" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="220" y="839">Component / process</text>
    <line x1="380" y1="835" x2="420" y2="835" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow1)"/>
    <text x="428" y="839">Data flow, [THR-xxx] = threat-registry.md cross-reference</text>
  </g>

  <text x="700" y="875" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#6b7280">
    See docs/security/threat-registry.md for full threat descriptions, current controls, and residual risk ratings for each referenced THR-xxx ID.
  </text>
</svg>
