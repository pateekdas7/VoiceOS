<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="monospace, sans-serif">
  <rect width="1000" height="680" fill="#f8f9fa" rx="4"/>

  <!-- Title -->
  <text x="500" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">VoiceOS — Level 1 Data Flow Diagram (Component View)</text>
  <text x="500" y="46" text-anchor="middle" font-size="10" fill="#555">Sprint-028 · V4 Ch20 · STRIDE threats annotated in orange/red</text>

  <!-- ============================================================ -->
  <!-- Arrow markers -->
  <!-- ============================================================ -->
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#555"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#c62828"/>
