  </defs>

  <!-- ============================================================ -->
  <!-- Trust zone backgrounds -->
  <!-- ============================================================ -->
  <!-- DMZ zone -->
  <rect x="10" y="60" width="980" height="100" fill="#e3f2fd" stroke="#90caf9" stroke-width="1" stroke-dasharray="6,3" rx="8"/>
  <text x="18" y="76" font-size="10" fill="#1565c0" font-weight="bold">DMZ Zone (TLS 1.3 terminated here)</text>

  <!-- Application zone -->
